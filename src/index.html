<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="utf-8" />
    <title>AirGap Vault</title>
    <base href="/" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Mobile Optimization -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#000000" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Security -->
    <!-- Relaxed CSP kept only where legacy compatibility is required -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' data:;
        img-src 'self' data: blob:;
        font-src 'self' data:;
        worker-src 'self' blob:;
        child-src blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
      "
    />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/png"
      href="assets/icon/favicon.png"
    />

    <!-- Startup Error Detection -->
    <script
      src="assets/js/error-check.js"
      defer
    ></script>
  </head>

  <body>
    <noscript>
      <p>
        JavaScript is required to run AirGap Vault.
      </p>
    </noscript>

    <airgap-root></airgap-root>
  </body>
</html>
